<!doctype html>
<html><head><meta charset="utf-8"><title>sushLoad</title>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="options.css"></head>
<body>
<main>
  <h1 data-i18n="optTitle"></h1>
  <div class="card">
    <div class="frow"><div class="flabel"><div data-i18n="optCapture"></div><div class="muted small" data-i18n="optCaptureHint"></div></div>
      <button class="switch" id="enabled" role="switch" aria-checked="true"><i></i></button></div>
    <div class="frow"><div class="flabel"><div data-i18n="optAsk"></div><div class="muted small" data-i18n="optAskHint"></div></div>
      <button class="switch" id="ask" role="switch" aria-checked="true"><i></i></button></div>
    <div class="frow col"><div data-i18n="optTypes"></div><textarea class="field" id="exts" rows="4" spellcheck="false"></textarea>
      <div class="muted small" data-i18n="optTypesHint"></div></div>
    <div class="frow col"><div data-i18n="optDocTypes"></div><textarea class="field" id="docExts" rows="2" spellcheck="false"></textarea>
      <div class="muted small" data-i18n="optDocTypesHint"></div></div>
    <div class="frow"><div class="flabel" data-i18n="optMinSize"></div>
      <input class="field num" id="minSize" type="number" min="0" step="any"></div>
    <div class="frow col"><div data-i18n="optSites"></div><textarea class="field" id="sites" rows="3" spellcheck="false"></textarea>
      <div class="muted small" data-i18n="optSitesHint"></div></div>
    <div class="frow last"><div class="flabel"><div data-i18n="optRemembered"></div><div class="muted small" id="remembered"></div></div>
      <button class="btn" id="forget" data-i18n="optForget"></button></div>
  </div>
  <div class="small ok" id="saved"></div>
</main>
<script type="module" src="options.js"></script>
</body></html>
