[package]
name = "sushload-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "system-proxy", "socks"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "io-util", "time", "macros"] }
