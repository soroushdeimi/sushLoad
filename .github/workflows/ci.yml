name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Bundle
        run: scripts/bundle.sh

      - name: Smoke-run the bundled binary (web mode)
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          dist/sushLoad.app/Contents/MacOS/sushload --web --no-open --port 47999 &
          pid=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:47999/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:47999/ | grep -q sushLoad
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47999/api/state)
          [ "$code" = 401 ] || { echo "::error::/api/state without token returned $code"; exit 1; }
          kill $pid
